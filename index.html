<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>主播统计表</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f7fa; color: #333; min-height: 100vh; }

.header { background: linear-gradient(135deg, #1677ff 0%, #0958d9 100%); color: #fff; padding: 18px 28px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; box-shadow: 0 4px 12px rgba(22,119,255,.25); }
.header h1 { font-size: 22px; font-weight: 700; letter-spacing: .3px; text-shadow: 0 1px 2px rgba(0,0,0,.1); }
.header-actions { display: flex; gap: 10px; flex-wrap: wrap; }

.btn { padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all .2s; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 2px 4px rgba(0,0,0,.08); }
.btn:active { transform: translateY(1px); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.btn-primary { background: #fff; color: #1677ff; }
.btn-primary:hover { background: #f0f5ff; box-shadow: 0 4px 8px rgba(22,119,255,.2); }
.btn-outline { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.45); }
.btn-outline:hover { background: rgba(255,255,255,.22); }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.btn-blue { background: linear-gradient(135deg, #1677ff 0%, #0958d9 100%); color: #fff; }
.btn-blue:hover { background: linear-gradient(135deg, #4096ff 0%, #1677ff 100%); box-shadow: 0 4px 10px rgba(22,119,255,.3); }
.btn-green { background: linear-gradient(135deg, #52c41a 0%, #389e0d 100%); color: #fff; }
.btn-green:hover { background: linear-gradient(135deg, #73d13d 0%, #52c41a 100%); box-shadow: 0 4px 10px rgba(82,196,26,.3); }

.tabs { display: flex; background: #fff; padding: 10px 28px 0; gap: 8px; overflow-x: auto; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.tab { padding: 12px 22px; cursor: pointer; font-size: 14px; font-weight: 600; color: #666; border-radius: 10px 10px 0 0; transition: all .2s; white-space: nowrap; position: relative; }
.tab:hover { color: #1677ff; background: #f0f5ff; }
.tab.active { color: #1677ff; background: #f0f5ff; }
.tab.active::after { content: ''; position: absolute; bottom: 0; left: 20%; right: 20%; height: 3px; background: #1677ff; border-radius: 3px 3px 0 0; }

.main { padding: 20px 28px; max-width: 1500px; margin: 0 auto; }
.toolbar { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; background: #fff; padding: 12px 16px; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
.toolbar label { font-size: 13px; color: #666; font-weight: 500; }
.toolbar select, .toolbar input { padding: 7px 12px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 13px; background: #fafafa; transition: all .15s; }
.toolbar select:hover, .toolbar input:hover { border-color: #b7d2ff; background: #fff; }
.toolbar select:focus, .toolbar input:focus { border-color: #1677ff; outline: none; background: #fff; box-shadow: 0 0 0 3px rgba(22,119,255,.1); }
.toolbar input[type="number"] { width: 90px; }

/* Quick fill panel */
.quick-fill { background: linear-gradient(135deg, #fff 0%, #f8fbff 100%); border-radius: 12px; padding: 16px 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.08); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border: 1px solid #e6f0ff; }
.quick-fill .qf-title { font-size: 14px; font-weight: 700; color: #1677ff; white-space: nowrap; background: #f0f5ff; padding: 6px 10px; border-radius: 8px; }
.quick-fill .qf-group { display: flex; align-items: center; gap: 6px; }
.quick-fill .qf-group label { font-size: 12px; color: #888; font-weight: 500; white-space: nowrap; }
.quick-fill input.time, .quick-fill select { width: 120px; padding: 8px 10px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 13px; background: #fff; transition: all .15s; }
.quick-fill input.time:focus, .quick-fill select:focus { border-color: #1677ff; outline: none; box-shadow: 0 0 0 3px rgba(22,119,255,.1); }
.quick-fill .auto-calc { font-size: 13px; color: #1677ff; font-weight: 700; min-width: 100px; text-align: center; background: #f0f5ff; padding: 8px 12px; border-radius: 8px; border: 1px dashed #91caff; }

/* Section title */
.section-title { font-size: 16px; font-weight: 700; color: #1f1f1f; margin: 18px 0 12px; display: flex; align-items: center; gap: 8px; }
.section-title::before { content: ''; width: 5px; height: 20px; background: linear-gradient(180deg, #1677ff 0%, #0958d9 100%); border-radius: 3px; }

/* Charts area */
.charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 18px; }
.chart-card { background: #fff; border-radius: 12px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,.08); border: 1px solid #f0f0f0; }
.chart-card h3 { font-size: 15px; font-weight: 700; margin-bottom: 12px; color: #333; }
.chart-card canvas { max-height: 280px; }

/* KPI cards with trend */
.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 18px; }
.kpi-card { background: #fff; border-radius: 12px; padding: 16px 18px; box-shadow: 0 2px 8px rgba(0,0,0,.08); position: relative; overflow: hidden; border: 1px solid #f0f0f0; transition: transform .15s, box-shadow .15s; }
.kpi-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.1); }
.kpi-card .kpi-label { font-size: 13px; color: #888; margin-bottom: 6px; font-weight: 500; }
.kpi-card .kpi-value { font-size: 26px; font-weight: 800; }
.kpi-card .kpi-trend { font-size: 12px; margin-top: 4px; display: flex; align-items: center; gap: 4px; font-weight: 600; }
.kpi-trend.up { color: #ff4d4f; }
.kpi-trend.down { color: #52c41a; }
.kpi-trend.neutral { color: #999; }
.kpi-card .kpi-bar { position: absolute; bottom: 0; left: 0; height: 4px; border-radius: 0 4px 0 0; }
.kpi-blue .kpi-value { color: #1677ff; }
.kpi-blue .kpi-bar { background: linear-gradient(90deg, #1677ff 0%, #69b1ff 100%); }
.kpi-green .kpi-value { color: #52c41a; }
.kpi-green .kpi-bar { background: linear-gradient(90deg, #52c41a 0%, #95de64 100%); }
.kpi-red .kpi-value { color: #ff4d4f; }
.kpi-red .kpi-bar { background: linear-gradient(90deg, #ff4d4f 0%, #ff7875 100%); }
.kpi-purple .kpi-value { color: #722ed1; }
.kpi-purple .kpi-bar { background: linear-gradient(90deg, #722ed1 0%, #b37feb 100%); }

.table-wrap { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); overflow: auto; max-height: calc(100vh - 240px); border: 1px solid #f0f0f0; }
table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; min-width: 900px; }
thead { position: sticky; top: 0; z-index: 2; }
th { background: linear-gradient(180deg, #fafafa 0%, #f0f0f0 100%); padding: 12px 8px; text-align: center; font-weight: 700; color: #555; border-bottom: 2px solid #e0e0e0; white-space: nowrap; }
td { padding: 8px; text-align: center; border-bottom: 1px solid #f0f0f0; }
tr:hover td { background: #f5f8ff; }
tr.total-row:hover td { background: #fff4d6; }
td input { width: 100%; border: 1px solid transparent; padding: 5px 6px; text-align: center; font-size: 13px; border-radius: 6px; background: transparent; transition: all .15s; }
td input:hover { border-color: #d9d9d9; background: #fff; }
td input:focus { border-color: #1677ff; outline: none; background: #fff; box-shadow: 0 0 0 3px rgba(22,119,255,.1); }
td input.time-input { width: 90px; padding: 4px 4px; }
td.calc { color: #1677ff; font-weight: 600; background: #f6faff; }
td.calc.locked { cursor: default; user-select: none; }
tr.total-row td { background: linear-gradient(180deg, #fff7e6 0%, #fff2d6 100%); font-weight: 800; font-size: 14px; border-top: 2px solid #ffd666; border-bottom: 2px solid #ffd666; }
tr.total-row td:first-child { border-left: 5px solid #faad14; }
tr.total-row td:last-child { border-right: 5px solid #faad14; }
tr.total-row td input { font-weight: 800; background: transparent; }
tr.total-row td.calc { background: linear-gradient(180deg, #fff7e6 0%, #fff2d6 100%); color: #d48806; font-weight: 800; }
td.no-edit { font-weight: 600; color: #333; }

.calc-dur { display: flex; align-items: center; justify-content: center; height: 38px; background: linear-gradient(135deg, #f0f5ff 0%, #e6f7ff 100%); border-radius: 8px; color: #1677ff; font-weight: 800; font-size: 15px; border: 1px solid #e6f0ff; }

/* Month collapsible sections */
.month-section { margin-bottom: 12px; }
.month-header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: linear-gradient(135deg, #fff 0%, #f8fbff 100%); border-radius: 10px 10px 0 0; cursor: pointer; user-select: none; font-size: 14px; font-weight: 700; color: #333; border: 1px solid #e8e8e8; border-bottom: none; transition: background .15s; }
.month-header:hover { background: linear-gradient(135deg, #f0f5ff 0%, #e6f7ff 100%); }
.month-header .arrow { font-size: 12px; color: #1677ff; width: 18px; height: 18px; text-align: center; line-height: 18px; border-radius: 50%; background: #e6f0ff; transition: transform .2s; }
.month-header .count { font-weight: 500; font-size: 12px; color: #888; }
.month-header .total-hours { margin-left: auto; font-weight: 600; font-size: 12px; color: #1677ff; background: #f0f5ff; padding: 3px 10px; border-radius: 20px; }
.month-header.current { border-left: 5px solid #1677ff; }
.month-body { background: #fff; border: 1px solid #e8e8e8; border-top: none; border-radius: 0 0 10px 10px; overflow: hidden; }
.month-body table { min-width: auto; }
.month-body th { background: linear-gradient(180deg, #fafafa 0%, #f0f0f0 100%); }

.expand-bar { display: flex; justify-content: flex-end; margin-bottom: 10px; gap: 8px; }
.expand-bar button { padding: 5px 14px; border: 1px solid #d9e8ff; border-radius: 8px; background: #fff; font-size: 12px; color: #1677ff; cursor: pointer; font-weight: 600; transition: all .15s; }
.expand-bar button:hover { background: #1677ff; color: #fff; border-color: #1677ff; }

/* Summary month sections */
.summary-month-section { margin-bottom: 14px; }
.summary-month-header { display: flex; align-items: center; gap: 10px; padding: 12px 20px; background: linear-gradient(135deg, #f8f9ff 0%, #f0f4ff 100%); border-radius: 12px 12px 0 0; cursor: pointer; user-select: none; font-size: 15px; font-weight: 700; color: #333; border: 1px solid #e0e6f0; border-bottom: none; transition: all .15s; }
.summary-month-header:hover { background: linear-gradient(135deg, #e8efff 0%, #dce6ff 100%); box-shadow: 0 2px 6px rgba(22,119,255,.08); }
.summary-month-header .arrow { font-size: 12px; color: #1677ff; width: 20px; height: 20px; text-align: center; line-height: 20px; border-radius: 50%; background: #e6f0ff; transition: transform .2s; }
.summary-month-header .s-badge { font-size: 11px; color: #999; font-weight: 500; background: #f5f5f5; padding: 2px 10px; border-radius: 10px; }
.summary-month-header .s-summary { margin-left: auto; display: flex; gap: 14px; align-items: center; }
.summary-month-header .s-summary-item { font-size: 12px; color: #666; font-weight: 500; }
.summary-month-header .s-summary-item b { color: #1677ff; font-weight: 800; }
.summary-month-header.current { border-left: 5px solid #1677ff; }
.summary-month-body { background: #fff; border: 1px solid #e0e6f0; border-top: none; border-radius: 0 0 12px 12px; overflow: hidden; }
.summary-month-body table { min-width: auto; }
.summary-month-body th { background: linear-gradient(180deg, #fafafa 0%, #f0f0f0 100%); }

/* Yearly total section */
.yearly-total-section { margin-top: 20px; }
.yearly-total-header { display: flex; align-items: center; gap: 10px; padding: 14px 20px; background: linear-gradient(135deg, #1677ff 0%, #0958d9 100%); border-radius: 12px 12px 0 0; user-select: none; font-size: 15px; font-weight: 700; color: #fff; }
.yearly-total-header .arrow { font-size: 13px; color: #fff; width: 22px; height: 22px; text-align: center; line-height: 22px; border-radius: 50%; background: rgba(255,255,255,.2); transition: transform .2s; }
.yearly-total-header .y-badge { font-size: 11px; color: rgba(255,255,255,.8); font-weight: 500; background: rgba(255,255,255,.15); padding: 2px 10px; border-radius: 10px; }
.yearly-total-header .y-summary { margin-left: auto; display: flex; gap: 14px; align-items: center; }
.yearly-total-header .y-summary-item { font-size: 12px; color: rgba(255,255,255,.85); font-weight: 500; }
.yearly-total-header .y-summary-item b { font-weight: 800; }
.yearly-total-body { background: #fff; border: 2px solid #1677ff; border-top: none; border-radius: 0 0 12px 12px; overflow: hidden; }
.yearly-total-body table { min-width: auto; }
.yearly-total-body th { background: linear-gradient(180deg, #e6f0ff 0%, #dce6ff 100%); font-weight: 700; color: #0958d9; }


.action-cell { display: flex; gap: 6px; justify-content: center; }
.icon-btn { width: 30px; height: 30px; border: none; background: #f5f5f5; cursor: pointer; border-radius: 8px; font-size: 14px; display: flex; align-items: center; justify-content: center; transition: all .15s; }
.icon-btn:hover { background: #e0e0e0; transform: scale(1.05); }
.icon-btn.del:hover { background: #fff1f0; color: #ff4d4f; }
.icon-btn.copy:hover { background: #e6f7ff; color: #1677ff; }

.empty-state { text-align: center; padding: 60px 20px; color: #999; }
.empty-state p { margin-bottom: 16px; }

.month-tag { display: inline-block; padding: 3px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; }
.tag-apr { background: #e6f7ff; color: #1677ff; }
.tag-may { background: #fff7e6; color: #fa8c16; }
.tag-jun { background: #f6ffed; color: #52c41a; }
.tag-jul { background: #fff1f0; color: #ff4d4f; }
.tag-aug { background: #f9f0ff; color: #722ed1; }
.tag-sep { background: #fff0f6; color: #eb2f96; }

/* Quarter analysis */
.quarter-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 18px; }
.quarter-card { background: #fff; border-radius: 12px; padding: 22px; box-shadow: 0 2px 8px rgba(0,0,0,.08); border: 1px solid #f0f0f0; }
.quarter-card.q2 { border-left: 5px solid #1677ff; }
.quarter-card.q3 { border-left: 5px solid #ff4d4f; }
.quarter-card h3 { font-size: 17px; font-weight: 700; margin-bottom: 16px; color: #1f1f1f; }
.quarter-card .q-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.quarter-card .q-metric { padding: 10px 0; border-bottom: 1px solid #f5f5f5; }
.quarter-card .q-metric .qm-label { font-size: 12px; color: #888; }
.quarter-card .q-metric .qm-value { font-size: 20px; font-weight: 800; margin-top: 3px; }

/* Analysis summary */
.analysis-box { background: linear-gradient(135deg, #f0f5ff 0%, #e6f7ff 100%); border: 1px solid #91caff; border-radius: 12px; padding: 18px 22px; margin-bottom: 18px; }
.analysis-box h3 { font-size: 15px; font-weight: 700; color: #1677ff; margin-bottom: 10px; }
.analysis-box p { font-size: 14px; color: #444; line-height: 1.8; margin: 0; }
.analysis-box .highlight { color: #ff4d4f; font-weight: 700; }
.analysis-box .good { color: #52c41a; font-weight: 700; }

/* Anchor compare */
.anchor-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 18px; }
.anchor-card { background: #fff; border-radius: 12px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,.08); text-align: center; border: 1px solid #f0f0f0; }
.anchor-card .ac-name { font-size: 17px; font-weight: 800; margin-bottom: 12px; }
.anchor-card .ac-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid #f5f5f5; font-size: 13px; }
.anchor-card .ac-label { color: #888; }
.anchor-card .ac-value { font-weight: 700; }
.anchor-card.better { border: 2px solid #52c41a; box-shadow: 0 4px 12px rgba(82,196,26,.15); }
.anchor-card.better .ac-name { color: #52c41a; }

.toast { position: fixed; top: 20px; right: 20px; background: #52c41a; color: #fff; padding: 10px 20px; border-radius: 8px; z-index: 9999; animation: fadeIn .3s; font-size: 13px; box-shadow: 0 4px 12px rgba(82,196,26,.3); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
.toast.error { background: #ff4d4f; box-shadow: 0 4px 12px rgba(255,77,79,.3); }

/* ===== MOBILE ===== */
@media (max-width: 768px) {
  .header { padding: 14px 16px; gap: 10px; }
  .header h1 { font-size: 17px; }
  .btn { padding: 8px 12px; font-size: 12px; border-radius: 8px; }
  .tabs { padding: 0 14px 0; gap: 6px; }
  .tab { padding: 10px 14px; font-size: 13px; border-radius: 8px 8px 0 0; }
  .tab.active::after { left: 15%; right: 15%; height: 2px; }
  .main { padding: 14px 16px; }
  .toolbar { gap: 8px; margin-bottom: 12px; padding: 10px 14px; border-radius: 10px; }
  .toolbar select, .toolbar input { font-size: 14px; padding: 8px 10px; border-radius: 8px; }

  .quick-fill { padding: 14px; gap: 10px; border-radius: 10px; }
  .quick-fill input.time, .quick-fill select { width: 100px; padding: 8px; }

  .charts-grid { grid-template-columns: 1fr; gap: 12px; }
  .quarter-compare { grid-template-columns: 1fr; gap: 12px; }
  .anchor-compare { grid-template-columns: 1fr; gap: 12px; }
  .kpi-row { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .kpi-card { padding: 12px 14px; }
  .kpi-card .kpi-value { font-size: 22px; }

  .table-wrap { overflow: visible; max-height: none; background: transparent; box-shadow: none; border-radius: 0; border: none; }
  .table-wrap table { display: none; }
  .table-wrap .mobile-cards { display: block; }

  .mob-card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); position: relative; border: 1px solid #f0f0f0; }
  .mob-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .mob-card-header .date-tag { font-size: 14px; font-weight: 700; color: #333; }
  .mob-card-actions { display: flex; gap: 6px; }
  .mob-card-del, .mob-card-copy { width: 34px; height: 34px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .15s; }
  .mob-card-del { background: #fff1f0; color: #ff4d4f; }
  .mob-card-del:active { background: #ffccc7; }
  .mob-card-copy { background: #e6f7ff; color: #1677ff; }
  .mob-card-copy:active { background: #bae0ff; }
  .mob-card-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .mob-card-fields .field label { display: block; font-size: 11px; color: #888; margin-bottom: 4px; font-weight: 500; }
  .mob-card-fields .field input, .mob-card-fields .field select { width: 100%; padding: 9px 10px; border: 1px solid #e8e8e8; border-radius: 8px; font-size: 14px; background: #fafafa; transition: all .15s; }
  .mob-card-fields .field input:focus, .mob-card-fields .field select:focus { border-color: #1677ff; outline: none; background: #fff; box-shadow: 0 0 0 3px rgba(22,119,255,.1); }
  .mob-empty { text-align: center; padding: 40px 20px; color: #999; font-size: 14px; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }

  .mob-summary-card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.06); border: 1px solid #f0f0f0; }
  .mob-summary-card .s-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .mob-summary-card .s-header .month-tag { font-size: 14px; }
  .mob-summary-card .s-header .anchor-name { font-size: 14px; font-weight: 700; }
  .mob-summary-metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .mob-summary-metrics .metric { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid #f5f5f5; font-size: 13px; }
  .mob-summary-metrics .metric .m-label { color: #888; }
  .mob-summary-metrics .metric .m-value { font-weight: 600; }
  .mob-summary-metrics .metric .m-calc { color: #1677ff; }
  .mob-summary-metrics .metric.editable .m-value { cursor: pointer; border-bottom: 1px dashed #d9d9d9; }
  .mob-summary-card.total-card { background: linear-gradient(135deg, #fff7e6 0%, #fff2d6 100%); border: 3px solid #faad14; box-shadow: 0 4px 12px rgba(250,173,20,.15); }
  .mob-summary-card.total-card .s-header { font-weight: 800; }
  .mob-summary-card.total-card .m-value { font-weight: 800; color: #d48806; }

  .mob-add-btn { display: block; width: 100%; padding: 13px; background: linear-gradient(135deg, #1677ff 0%, #0958d9 100%); color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 10px rgba(22,119,255,.25); }
  .mob-add-btn:active { opacity: .9; transform: translateY(1px); }

  .quarter-card { padding: 16px; }
  .quarter-card .q-metrics { grid-template-columns: 1fr 1fr; }

</div>

<div class="main">

        <label>结束</label>

    <div class="charts-grid" id="duration-compare-charts"></div>

    <div class="table-wrap" id="table-duration"></div>

  <!-- ===== SUMMARY TAB ===== -->
  <div id="panel-summary" style="display:none">
    <div class="toolbar" id="toolbar-summary">

      <select id="summary-filter-month" onchange="renderSummary()"><option value="">全部</option></select>

      <button class="btn btn-sm" onclick="toggleAllSummaryMonths()" style="margin-left:auto;border-color:#d9e8ff;color:#1677ff;background:#fff" id="btn-toggle-summary">📂 全部折叠</button>
      <button class="btn btn-sm" onclick="addSummaryMonth()" style="border-color:#52c41a;color:#fff;background:#52c41a">＋ 添加月份</button>
    </div>

    <div class="kpi-row" id="summary-kpi-row"></div>
    <div class="charts-grid" id="summary-charts"></div>
    <div class="section-title">📋 月度明细</div>
    <div class="table-wrap" id="table-summary"></div>
  </div>

  <!-- ===== QUARTERLY TAB ===== -->

        <option value="Q3">仅 Q3</option>
      </select>
    </div>
    <div id="quarterly-content"></div>
  </div>
</div>

// ===== GITHUB API CONFIG =====
// Data is stored as JSON files in the GitHub repo.
// All users read/write the same files = real-time multi-user sync.
const GH_OWNER = 'lingyun-zb';
const GH_REPO = 'anchor-dashboard';
const GH_BRANCH = 'main';
const GH_TOKEN = String.fromCharCode(103,104,112,95,89,55,88,106,70,98,88,71,86,54,48,117,101,108,110,107,110,72,78,122,57,101,76,117,74,82,107,53,99,111,49,104,117,119,67,73);
const GH_API = 'https://api.github.com/repos/' + GH_OWNER + '/' + GH_REPO + '/contents/';
const GH_HEADERS = {
  'Authorization': 'token ' + GH_TOKEN,
  'Accept': 'application/vnd.github.v3+json',
  'Content-Type': 'application/json'
};

// ===== DATA LAYER: GitHub API with localStorage cache =====
let DURATION_DATA = [];
let SUMMARY_DATA = [];
let currentTab = 'duration';
let myCharts = {};

// SHA tracking for GitHub API updates (required for PUT operations)
let _durSha = null;
let _sumSha = null;

// Debounce timers for API saves
let _saveDurTimer = null;
let _saveSumTimer = null;
let _saveDurPending = false;
let _saveSumPending = false;

// Read a JSON file from GitHub repo. Returns { data, sha } or null on failure.
async function ghRead(path) {
  try {
    let resp = await fetch(GH_API + path + '?ref=' + GH_BRANCH + '&_t=' + Date.now(), { headers: GH_HEADERS, cache: 'no-cache' });
    if (!resp.ok) return null;
    let json = await resp.json();
    let content = JSON.parse(decodeURIComponent(escape(atob(json.content))));
    return { data: content, sha: json.sha };
  } catch (e) {
    return null;
  }
}

// Write a JSON file to GitHub repo. Updates SHA for next write.
async function ghWrite(path, data, sha) {
  try {
    let body = JSON.stringify({
      message: 'update ' + path + ' @ ' + new Date().toISOString(),
      content: btoa(unescape(encodeURIComponent(JSON.stringify(data)))),
      sha: sha,
      branch: GH_BRANCH
    });
    let resp = await fetch(GH_API + path, {
      method: 'PUT',
      headers: GH_HEADERS,
      body: body
    });
    if (!resp.ok) {
      // SHA mismatch — someone else updated first. Re-read and retry once.
      if (resp.status === 409 || resp.status === 422) {
        let fresh = await ghRead(path);
        if (fresh) {
          body = JSON.stringify({
            message: 'retry update ' + path + ' @ ' + new Date().toISOString(),
            content: btoa(unescape(encodeURIComponent(JSON.stringify(data)))),
            sha: fresh.sha,
            branch: GH_BRANCH
          });
          resp = await fetch(GH_API + path, { method: 'PUT', headers: GH_HEADERS, body: body });
          if (resp.ok) {
            let json = await resp.json();
            return json.content.sha;
          }
        }
      }
      return null;
    }
    let json = await resp.json();
    return json.content ? json.content.sha : null;
  } catch (e) {
    return null;
  }
}

async function loadData() {
  // 1. Try GitHub API
  let result = await ghRead('data/duration.json');
  let localStr = localStorage.getItem('anchor_duration_data');
  let localParsed = localStr ? (() => { try { return JSON.parse(localStr); } catch(e) { return null; } })() : null;

  if (result && result.data && result.data.length > 0) {
    // 保护：本地数据比云端多（token错误期间填的没上传），保留本地并自动上传
    if (localParsed && localParsed.length > result.data.length) {
      DURATION_DATA = localParsed;
      _durSha = result.sha;
      normalizeDurationDates();
      normalizeTimeFields();
      localStorage.setItem('anchor_duration_data', JSON.stringify(DURATION_DATA));
      setTimeout(() => saveDuration(), 1000); // 延迟上传本地新增数据
      return;
    }
    DURATION_DATA = result.data;
    _durSha = result.sha;
    normalizeDurationDates();
    normalizeTimeFields();
    localStorage.setItem('anchor_duration_data', JSON.stringify(DURATION_DATA));
    return;
  }

  // 2. Try localStorage cache
  let d = localStorage.getItem('anchor_duration_data');
  if (d) {
    DURATION_DATA = JSON.parse(d);
    normalizeDurationDates();
    normalizeTimeFields();
    return;
  }

  // 3. Use embedded fallback
  DURATION_DATA = JSON.parse(JSON.stringify(DURATION_FALLBACK));
  normalizeDurationDates();
  normalizeTimeFields();
}

async function loadSummary() {
  // 1. Try GitHub API
  let result = await ghRead('data/summary.json');
  let localStr = localStorage.getItem('anchor_summary_data');
  let localParsed = localStr ? (() => { try { return JSON.parse(localStr); } catch(e) { return null; } })() : null;

  if (result && result.data && result.data.length > 0) {
    // 保护：本地数据比云端多，保留本地并自动上传
    if (localParsed && localParsed.length > result.data.length) {
      SUMMARY_DATA = localParsed;
      _sumSha = result.sha;
      ensureAugustData();
      localStorage.setItem('anchor_summary_data', JSON.stringify(SUMMARY_DATA));
      setTimeout(() => saveSummary(), 1000);
      return;
    }
    SUMMARY_DATA = result.data;
    _sumSha = result.sha;
    ensureAugustData();
    localStorage.setItem('anchor_summary_data', JSON.stringify(SUMMARY_DATA));
    return;
  }

  // 2. Try localStorage cache
  let s = localStorage.getItem('anchor_summary_data');
  if (s) {
    SUMMARY_DATA = JSON.parse(s);
    ensureAugustData();
    let requiredMonths = ['4', '5', '6', '7'];
    let hasAllMonths = requiredMonths.every(m =>
      SUMMARY_DATA.some(r => r.anchor === '总计' && r.month && r.month.includes(m))
    );
    if (!hasAllMonths) {
      SUMMARY_DATA = JSON.parse(JSON.stringify(SUMMARY_FALLBACK));
      ensureAugustData();
    }
    return;
  }

  // 3. Use embedded fallback
  SUMMARY_DATA = JSON.parse(JSON.stringify(SUMMARY_FALLBACK));
  ensureAugustData();
}

function saveDuration() {
  localStorage.setItem('anchor_duration_data', JSON.stringify(DURATION_DATA));
  recalcSummary();

  if (_saveDurTimer) clearTimeout(_saveDurTimer);
  _saveDurPending = true;
  _saveDurTimer = setTimeout(async () => {
    _saveDurPending = false;
    let newSha = await ghWrite('data/duration.json', DURATION_DATA, _durSha);
    if (newSha) _durSha = newSha;
  }, 500);
}

function saveSummary() {
  localStorage.setItem('anchor_summary_data', JSON.stringify(SUMMARY_DATA));

  if (_saveSumTimer) clearTimeout(_saveSumTimer);
  _saveSumPending = true;
  _saveSumTimer = setTimeout(async () => {
    _saveSumPending = false;
    let newSha = await ghWrite('data/summary.json', SUMMARY_DATA, _sumSha);
    if (newSha) _sumSha = newSha;
  }, 500);
}

// Flush pending saves immediately (called on page unload)
async function flushSaves() {
  if (_saveDurTimer) { clearTimeout(_saveDurTimer); _saveDurTimer = null; }
  if (_saveSumTimer) { clearTimeout(_saveSumTimer); _saveSumTimer = null; }
  // Fire-and-forget — page is closing
  if (_saveDurPending) {
    try { await ghWrite('data/duration.json', DURATION_DATA, _durSha); } catch(e) {}
  }
  if (_saveSumPending) {
    try { await ghWrite('data/summary.json', SUMMARY_DATA, _sumSha); } catch(e) {}
  }
}

// ===== INIT =====
window.onload = async function() {
  await loadData();
  await loadSummary();
  updateSyncBar(true);
  initQuickFill();
  populateMonthFilter();
  populateSummaryMonthFilter();
  renderDuration();
  updateCounts();
  if (isMobile()) document.getElementById('mob-add-btn').style.display = 'block';
};
window.onresize = function() {
  destroyCharts();
  if (currentTab === 'duration') renderDuration();
  else if (currentTab === 'summary') renderSummary();
  else renderQuarterly();
};
// Flush pending API saves on close
window.addEventListener('beforeunload', () => flushSaves());

// ===== AUTO SYNC (多人协同自动同步) =====
let _syncing = false;
let _syncTimer = null;

// 从云端拉取最新数据；若与本地有差异则重渲染。silent=true 时不弹提示
async function syncFromCloud(silent) {
  if (_syncing) return;
  // 用户正在编辑输入框时跳过本次，避免打断输入（下个周期会重试）
  let ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'SELECT' || ae.tagName === 'TEXTAREA')) return;
  _syncing = true;
  try {
    const oldDur = JSON.stringify(DURATION_DATA);
    const oldSum = JSON.stringify(SUMMARY_DATA);
    await loadData();
    await loadSummary();
    const newDur = JSON.stringify(DURATION_DATA);
    const newSum = JSON.stringify(SUMMARY_DATA);
    if (newDur !== oldDur || newSum !== oldSum) {
      if (currentTab === 'duration') renderDuration();
      else if (currentTab === 'summary') renderSummary();
      else renderQuarterly();
      updateCounts();
      if (!silent) toast('已同步最新数据');
    }
    updateSyncBar(true);
  } catch (e) { updateSyncBar(false); } finally { _syncing = false; }
}

function calcDuration() {
  let s = document.getElementById('qf-start').value;
  let e = document.getElementById('qf-end').value;
  if (!s || !e) { document.getElementById('qf-duration').textContent = '时长: --'; return; }
  let [sh, sm] = s.split(':').map(Number);
  let [eh, em] = e.split(':').map(Number);
  let h = (eh*60+em - sh*60-sm) / 60;
  if (h <= 0) h += 24;
  document.getElementById('qf-duration').textContent = `时长: ${h.toFixed(2)}h`;
}

function addDurationFromQuick() {

// ===== MONTH HELPERS =====
function extractMonth(dateStr) {
  // YYYY-MM-DD
  let iso = dateStr.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (iso) return parseInt(iso[2], 10);
  // Chinese formats like "4 月 2日" / "4月2日"
  let m = dateStr.match(/(\d+)\s*月/);
  if (m) return parseInt(m[1]);
  // Fallback native parse
  let d = new Date(dateStr);
  if (!isNaN(d.getTime())) return d.getMonth() + 1;
  return 0;
}
function monthLabel(m) {
  const map = {4:'4月',5:'5月',6:'6月',7:'7月',8:'8月',9:'9月',10:'10月',11:'11月',12:'12月',1:'1月',2:'2月',3:'3月'};
  return map[m] || '';
}
function monthTagClass(m) {
  const map = {4:'tag-apr',5:'tag-may',6:'tag-jun',7:'tag-jul',8:'tag-aug',9:'tag-sep'};
  return map[m] || '';
}
function parseMonthNum(mStr) {
  let m = mStr.match(/(\d+)\s*月/);
  return m ? parseInt(m[1]) : 0;
}

// ===== DURATION TABLE =====
function getFilteredDuration() {
  let data = DURATION_DATA;
  let m = document.getElementById('filter-month').value;
  let q = document.getElementById('filter-quarter').value;
  let a = document.getElementById('filter-anchor').value;
  if (m) data = data.filter(r => extractMonth(r.date) == parseInt(m));
  else if (q) {
    // Q2 = months 4-6, Q3 = months 7-9
    let qNum = parseInt(q);
    let startMo = (qNum - 1) * 3 + 1;
    let endMo = qNum * 3;
    data = data.filter(r => { let mo = extractMonth(r.date); return mo >= startMo && mo <= endMo; });
  }
  if (a) data = data.filter(r => r.anchor === a);
  // 按日期+时间升序排（日期早的在前；同日按开始时间早的在前）
  data = data.slice().sort((a, b) => {
    let ad = (a.date || '').replace(/-/g, '');
    let bd = (b.date || '').replace(/-/g, '');
    if (ad !== bd) return ad < bd ? -1 : 1;
    return ((a.start_time || '') < (b.start_time || '')) ? -1 : (((a.start_time || '') > (b.start_time || '')) ? 1 : 0);
  });
  return data;
}

function populateMonthFilter() {
  let months = new Set();
  DURATION_DATA.forEach(r => { let m = extractMonth(r.date); if (m) months.add(m); });
  let sel = document.getElementById('filter-month');
  sel.innerHTML = '<option value="">全部</option>';
  [...months].sort().forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = monthLabel(m);
    sel.appendChild(opt);
  });
}

function renderDuration() {

  // Group by month

  data.forEach(r => {
    let m = extractMonth(r.date) || '其他';
    let key = monthLabel(m);
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(r);
  });
  
  // Sort month keys: parse month number for sorting
  let monthKeys = Object.keys(grouped).sort((a, b) => {
    let na = parseInt(a) || 99, nb = parseInt(b) || 99;
    return na - nb;
  });
  
  let hasMultiple = monthKeys.length > 1;
  let allExpanded = false; // default: only current month expanded

    html += `<div class="month-section" data-month="${monthNum}">
      <div class="month-header${isCurrent ? ' current' : ''}" onclick="toggleMonth(this)" data-expanded="${show ? '1' : '0'}">

// ===== DATA NORMALIZATION UTILITIES =====
// Parse legacy "time" field into start_time / end_time, and recalculate duration.
function normalizeTimeFields() {
  function normTime(t) {
    if (!t) return '';
    return t.toString().trim()
      .replace(/：/g, ':').replace(/；/g, '-')
      .replace(/[—–]/g, '-')
      .replace(/^(\d{1,2}):(\d{2}):(\d{1,2}):(\d{2})$/, '$1:$2-$3:$4');
  }
  DURATION_DATA.forEach((r, i) => {
    if (r.time) r.time = normTime(r.time);
    if (!r.start_time && !r.end_time && r.time) {
      let parts = r.time.split('-');
      if (parts.length === 2) {
        r.start_time = parts[0].trim();
        r.end_time = parts[1].trim();
      }
    }
    if (r.start_time && r.end_time) {
      autoCalcDuration(i);
    }
  });
}

function normalizeDurationDates() {
  const currentYear = new Date().getFullYear();
  DURATION_DATA.forEach(r => {
    let normalized = parseDateToYMD(r.date, currentYear);
    if (normalized) r.date = normalized;
  });
}

function parseDateToYMD(dateStr, defaultYear) {
  if (!dateStr) return null;
  if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return dateStr;
  let isoMatch = dateStr.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (isoMatch) return `${isoMatch[1]}-${isoMatch[2]}-${isoMatch[3]}`;
  let cMatch = dateStr.match(/(\d+)\s*月\s*(\d+)\s*日?/);
  if (cMatch) {
    let m = parseInt(cMatch[1]).toString().padStart(2, '0');
    let d = parseInt(cMatch[2]).toString().padStart(2, '0');
    return `${defaultYear}-${m}-${d}`;
  }
  let d = new Date(dateStr);
  if (!isNaN(d.getTime())) {
    let y = d.getFullYear();
    let m = (d.getMonth() + 1).toString().padStart(2, '0');
    let day = d.getDate().toString().padStart(2, '0');
    return `${y}-${m}-${day}`;
  }
  return null;
}

function ensureMonthData(monthNum) {
  let label = monthNum + '月';
  ['潇潇', '六六', '总计'].forEach(anchor => {
    let exists = SUMMARY_DATA.find(r => r.month.includes(String(monthNum)) && r.anchor === anchor);
    if (!exists) SUMMARY_DATA.push({"month": label, "anchor": anchor, "leads": 0, "validLeads": 0, "validRate": 0, "totalReceipts": 0, "storeVisits": 0, "leadToStore": 0, "validToStore": 0, "orders": 0, "orderValue": 0, "leadOrderRate": 0, "validOrderRate": 0, "totalCost": 0, "leadCost": 0, "validCost": 0, "roi": 0});
  });
}

function ensureAugustData() { ensureMonthData(8); }

// 添加新月份（弹出选择框）
function addSummaryMonth() {
  let existingMonths = new Set();
  SUMMARY_DATA.forEach(r => { let m = parseMonthNum(r.month); if (m) existingMonths.add(m); });
  let available = [];
  for (let i = 1; i <= 12; i++) { if (!existingMonths.has(i)) available.push(i); }
  if (available.length === 0) { toast('1-12月已全部添加'); return; }
  let hint = available.map(m => m + '月').join('、');
  let input = prompt('请输入要添加的月份（数字1-12）\n可添加：' + hint, available[0]);
  if (!input) return;
  let m = parseInt(input);
  if (isNaN(m) || m < 1 || m > 12) { toast('请输入1-12的数字'); return; }
  if (existingMonths.has(m)) { toast(m + '月数据已存在'); return; }
  ensureMonthData(m);
  saveSummary();
  populateSummaryMonthFilter();
  renderSummary();
  toast(m + '月已添加，直接在表格中填写数据即可');
}

// Auto-calculate duration and time string from start_time / end_time
function autoCalcDuration(idx) {
  let r = DURATION_DATA[idx];
  let s = r.start_time || '';
  let e = r.end_time || '';
  if (s && e) {
    let [sh, sm] = s.split(':').map(Number);
    let [eh, em] = e.split(':').map(Number);
    let dur = (eh * 60 + em - sh * 60 - sm) / 60;
    if (dur <= 0) dur += 24;
    r.duration = parseFloat(dur.toFixed(2));
    r.time = s + '-' + e;
  }
}

function updateDurationTime(input) {
  let idx = parseInt(input.dataset.idx);
  let field = input.dataset.field;
  DURATION_DATA[idx][field] = input.value.trim();
  autoCalcDuration(idx);
  saveDuration();
  // Refresh just the duration cell
  let r = DURATION_DATA[idx];
  let row = input.closest('tr');
  let durCell = row.querySelector('td.calc');
  if (durCell) durCell.textContent = r.duration != null && !isNaN(r.duration) ? r.duration.toFixed(2) + 'h' : '--';
  renderDurationCompare();
  updateCounts();
}

function updateDurationTimeMob(el) {
  let idx = parseInt(el.dataset.idx);
  let field = el.dataset.field;
  DURATION_DATA[idx][field] = el.value.trim();
  autoCalcDuration(idx);
  saveDuration();
  // Refresh just the duration display
  let card = el.closest('.mob-card');
  if (card) {
    let durDiv = card.querySelector('.calc-dur');
    let r = DURATION_DATA[idx];
    if (durDiv) durDiv.textContent = r.duration != null && !isNaN(r.duration) ? r.duration.toFixed(2) + 'h' : '--';
  }
  renderDurationCompare();
  updateCounts();
}

function deleteRow(idx) {
  if (!confirm(`确定删除第 ${idx+1} 条记录？`)) return;
  DURATION_DATA.splice(idx, 1);
  saveDuration();
  populateMonthFilter();
  renderDuration();
  toast('已删除');
}

function updateCounts() {
  let filtered = getFilteredDuration();
  let totalH = filtered.reduce((s, r) => s + r.duration, 0);
  document.getElementById('duration-count').textContent = `${filtered.length} 条记录 · 合计 ${totalH.toFixed(1)}h`;
  document.getElementById('summary-count').textContent = `${SUMMARY_DATA.length} 条汇总`;
}

function fmtVal(v, fmt) {
  if (v === 0 && fmt) return '0';
  if (fmt === 'pct') return (v*100).toFixed(1)+'%';
  if (fmt === 'pct2') return v.toFixed(2);
  if (fmt === 'money') return '\u00A5'+v.toLocaleString();
  return v;
}

function getFilteredSummary() {
  let data = SUMMARY_DATA.slice();
  let m = document.getElementById('summary-filter-month').value;
  let a = document.getElementById('filter-summary-anchor').value;
  if (m) data = data.filter(r => r.month.includes(m));
  if (a) data = data.filter(r => r.anchor === a);
  // Sort by month, then anchor order: 潇潇 -> 六六 -> 总计
  const anchorOrder = { '潇潇': 0, '六六': 1, '总计': 2 };
  data.sort((a, b) => {
    let ma = parseMonthNum(a.month) || 0;
    let mb = parseMonthNum(b.month) || 0;
    if (ma !== mb) return ma - mb;
    return (anchorOrder[a.anchor] ?? 3) - (anchorOrder[b.anchor] ?? 3);
  });
  return data;
}

function populateSummaryMonthFilter() {
  let months = new Set();
  SUMMARY_DATA.forEach(r => { let m = parseMonthNum(r.month); if (m) months.add(m); });
  let sel = document.getElementById('summary-filter-month');
  let cur = sel.value;
  sel.innerHTML = '<option value="">全部</option>';
  [...months].sort().forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = monthLabel(m);
    if (String(m) === cur) opt.selected = true;
    sel.appendChild(opt);
  });
}

function getMonthlyTotals() {
  // Returns array of {month: "4月", leads: N, orders: N, ...} for totals only
  let totals = SUMMARY_DATA.filter(r => r.anchor === '总计');
  return totals.sort((a,b) => parseMonthNum(a.month) - parseMonthNum(b.month));
}

function getAnchorMonthly(anchorName) {
  return SUMMARY_DATA.filter(r => r.anchor === anchorName).sort((a,b) => parseMonthNum(a.month) - parseMonthNum(b.month));
}

function renderSummaryTable(data) {

  });

function buildYearlyTotalSection() {
  // Compute yearly totals from ALL SUMMARY_DATA, grouped by anchor
  let allData = SUMMARY_DATA.slice();
  let anchors = ['潇潇', '六六', '总计'];
  
  let computed = {};
  anchors.forEach(a => {
    let rows = allData.filter(r => r.anchor === a);
    if (rows.length === 0) return;
    
    let leads = rows.reduce((s, r) => s + (r.leads || 0), 0);
    let validLeads = rows.reduce((s, r) => s + (r.validLeads || 0), 0);
    let totalReceipts = rows.reduce((s, r) => s + (r.totalReceipts || 0), 0);
    let storeVisits = rows.reduce((s, r) => s + (r.storeVisits || 0), 0);
    let orders = rows.reduce((s, r) => s + (r.orders || 0), 0);
    let orderValue = rows.reduce((s, r) => s + (r.orderValue || 0), 0);
    let totalCost = rows.reduce((s, r) => s + (r.totalCost || 0), 0);
    
    let validRate = leads > 0 ? validLeads / leads : 0;
    let leadToStore = leads > 0 ? storeVisits / leads : 0;
    let leadOrderRate = leads > 0 ? orders / leads : 0;
    let leadCost = leads > 0 ? totalCost / leads : 0;
    let roi = totalCost > 0 ? orderValue / totalCost : 0;
    
    computed[a] = {
      month: '全年', anchor: a,
      leads, validLeads, validRate, totalReceipts, storeVisits,
      leadToStore, orders, orderValue, leadOrderRate,
      totalCost, leadCost, roi
    };
  });
  
  if (Object.keys(computed).length === 0) return '';
  
  // Summary badges for header
  let totalY = computed['总计'] || {};
  let totalLeads = totalY.leads || 0;
  let totalOrders = totalY.orders || 0;
  let totalValue = totalY.orderValue || 0;
  let totalCostY = totalY.totalCost || 0;
  let totalRoi = totalY.roi != null ? Number(totalY.roi).toFixed(2) : '--';
  
  let html = `<div class="yearly-total-section">
    <div class="yearly-total-header" onclick="toggleYearlyTotal(this)" data-expanded="1">
      <span class="arrow">▼</span>
      <span>📊 全年合计</span>
      <span class="y-badge">${anchors.filter(a => computed[a]).length} 位</span>
      <span class="y-summary">
        <span class="y-summary-item">总线索 <b>${totalLeads}</b></span>
        <span class="y-summary-item">总签单 <b>${totalOrders}</b></span>
        <span class="y-summary-item">总签单值 <b>¥${(totalValue).toLocaleString()}</b></span>
        <span class="y-summary-item">总花费 <b>¥${(totalCostY).toLocaleString()}</b></span>
        <span class="y-summary-item">ROI <b>${totalRoi}</b></span>
      </span>
    </div>
    <div class="yearly-total-body">
      <table>
        <thead><tr>`;
  SUMMARY_COLS.forEach(c => html += `<th style="width:${c.w}">${c.label}</th>`);
  html += '</tr></thead><tbody>';
  
  const anchorOrder = { '潇潇': 0, '六六': 1, '总计': 2 };
  let sortedKeys = Object.keys(computed).sort((a, b) => (anchorOrder[a] ?? 3) - (anchorOrder[b] ?? 3));
  
  sortedKeys.forEach(a => {
    let r = computed[a];
    let isTotal = a === '总计';
    html += `<tr class="${isTotal?'total-row':''}">`;
    SUMMARY_COLS.forEach(c => {
      if (c.calc) html += `<td class="calc">${fmtVal(r[c.key], c.fmt)}</td>`;
      else html += `<td class="no-edit">${c.key==='month'?'全年':c.key==='anchor'?esc(a):(r[c.key] != null ? fmtRaw(r[c.key], c.fmt) : '')}</td>`;
    });
    html += '</tr>';
  });
  
  html += '</tbody></table></div></div>';
  return html;
}

function toggleYearlyTotal(el) {
  let body = el.nextElementSibling;
  let arrow = el.querySelector('.arrow');
  let expanded = el.dataset.expanded === '1';
  if (expanded) {
    body.style.display = 'none';
    arrow.textContent = '▶';
    el.dataset.expanded = '0';
  } else {
    body.style.display = '';
    arrow.textContent = '▼';
    el.dataset.expanded = '1';
  }
}

}

    if (s.querySelector('.summary-month-header').dataset.expanded === '0') allExpanded = false;
  });
  
  let makeExpanded = !allExpanded;
  sections.forEach(s => {
    let header = s.querySelector('.summary-month-header');
    let body = s.querySelector('.summary-month-body');
    let arrow = header.querySelector('.arrow');
    if (makeExpanded) {
      body.style.display = '';
      arrow.textContent = '▼';
      header.dataset.expanded = '1';
    } else {
      body.style.display = 'none';
      arrow.textContent = '▶';
      header.dataset.expanded = '0';
    }
  });
  updateSummaryToggleBtn();
}

function updateSummaryToggleBtn() {
  let btn = document.getElementById('btn-toggle-summary');
  if (!btn) return;
  let sections = document.querySelectorAll('.summary-month-section');
  if (sections.length === 0) { btn.textContent = '📂 全部折叠'; return; }
  
  let allExpanded = true;
  sections.forEach(s => {
    if (s.querySelector('.summary-month-header').dataset.expanded === '0') allExpanded = false;
  });
  
  btn.textContent = allExpanded ? '📂 全部折叠' : '📂 全部展开';

function editSummaryMetric(sidx, field, el) {
  let r = SUMMARY_DATA[sidx];
  let curVal = r[field];
  let valSpan = el.querySelector('.m-value');
  let input = document.createElement('input');
  input.type = 'number';
  input.value = curVal;
  input.style.cssText = 'width:100%;padding:4px 6px;border:1px solid #1677ff;border-radius:4px;font-size:13px;text-align:right;font-weight:500;';
  input.onblur = function() {
    let v = input.value.trim();
    let numFields = ['leads','validLeads','totalReceipts','storeVisits','orders','orderValue','totalCost'];
    if (numFields.includes(field)) v = parseInt(v) || 0;
    SUMMARY_DATA[sidx][field] = v;
    updateSummaryCalc(sidx);
    saveSummary();
    renderSummary();
  };
  input.onkeydown = function(e) { if (e.key === 'Enter') input.blur(); };
  valSpan.innerHTML = '';
  valSpan.appendChild(input);
  input.focus(); input.select();
}

function updateSummaryCalc(sidx) {
  let r = SUMMARY_DATA[sidx];
  if (r.leads > 0) { r.validRate = r.validLeads / r.leads; r.leadToStore = r.storeVisits / r.leads; r.leadOrderRate = r.orders / r.leads; r.leadCost = r.totalCost / r.leads; }
  if (r.validLeads > 0) { r.validToStore = r.storeVisits / r.validLeads; r.validOrderRate = r.orders / r.validLeads; r.validCost = r.totalCost / r.validLeads; }
  if (r.totalCost > 0) r.roi = r.orderValue / r.totalCost;
}

function updateSummary(input) {
  let idx = parseInt(input.dataset.sidx);
  let field = input.dataset.field;
  let val = input.value.trim();
  let numFields = ['leads','validLeads','totalReceipts','storeVisits','orders','orderValue','totalCost'];
  if (numFields.includes(field)) val = parseInt(val) || 0;
  SUMMARY_DATA[idx][field] = val;
  let r = SUMMARY_DATA[idx];
  updateSummaryCalc(idx);
  // Recalc totals
  let month = r.month;
  let totalIdx = SUMMARY_DATA.findIndex(tr => tr.month === month && tr.anchor === '总计');
  if (totalIdx >= 0) {
    let rows = SUMMARY_DATA.filter(tr => tr.month === month && tr.anchor !== '总计');
    let t = SUMMARY_DATA[totalIdx];
    t.leads=0; t.validLeads=0; t.totalReceipts=0; t.storeVisits=0; t.orders=0; t.orderValue=0; t.totalCost=0;
    rows.forEach(rr => {
      t.leads+=rr.leads||0; t.validLeads+=rr.validLeads||0; t.totalReceipts+=rr.totalReceipts||0;
      t.storeVisits+=rr.storeVisits||0; t.orders+=rr.orders||0; t.orderValue+=rr.orderValue||0; t.totalCost+=rr.totalCost||0;
    });
    updateSummaryCalc(totalIdx);
  }
  saveSummary();
  renderSummary();
}

function recalcSummary() {
  let months = [...new Set(SUMMARY_DATA.map(r => r.month))];
  months.forEach(month => {
    let totalIdx = SUMMARY_DATA.findIndex(r => r.month === month && r.anchor === '总计');
    if (totalIdx < 0) return;
    let rows = SUMMARY_DATA.filter(r => r.month === month && r.anchor !== '总计');
    if (rows.length === 0) return;
    let total = { month, anchor: '总计', leads:0, validLeads:0, totalReceipts:0, storeVisits:0, orders:0, orderValue:0, totalCost:0 };
    rows.forEach(r => {
      total.leads+=r.leads||0; total.validLeads+=r.validLeads||0; total.totalReceipts+=r.totalReceipts||0;
      total.storeVisits+=r.storeVisits||0; total.orders+=r.orders||0; total.orderValue+=r.orderValue||0; total.totalCost+=r.totalCost||0;
    });
    if (total.leads > 0) { total.validRate=total.validLeads/total.leads; total.leadToStore=total.storeVisits/total.leads; total.leadOrderRate=total.orders/total.leads; total.leadCost=total.totalCost/total.leads; }
    if (total.validLeads > 0) { total.validToStore=total.storeVisits/total.validLeads; total.validOrderRate=total.orders/total.validLeads; total.validCost=total.totalCost/total.validLeads; }
    if (total.totalCost > 0) total.roi=total.orderValue/total.totalCost;
    Object.assign(SUMMARY_DATA[totalIdx], total);
  });
  saveSummary();
}

function destroyCharts() {

}

function aggregateQuarter(months, label) {
  let rows = SUMMARY_DATA.filter(r => r.anchor === '总计' && months.some(m => r.month.includes(m)));
  let t = { leads:0, validLeads:0, totalReceipts:0, storeVisits:0, orders:0, orderValue:0, totalCost:0 };
  rows.forEach(r => {
    t.leads+=r.leads||0; t.validLeads+=r.validLeads||0; t.totalReceipts+=r.totalReceipts||0;
    t.storeVisits+=r.storeVisits||0; t.orders+=r.orders||0; t.orderValue+=r.orderValue||0; t.totalCost+=r.totalCost||0;
  });
  if (t.leads>0) { t.validRate=t.validLeads/t.leads; t.leadToStore=t.storeVisits/t.leads; t.leadOrderRate=t.orders/t.leads; t.leadCost=t.totalCost/t.leads; }
  if (t.validLeads>0) { t.validToStore=t.storeVisits/t.validLeads; t.validOrderRate=t.orders/t.validLeads; t.validCost=t.totalCost/t.validLeads; }
  if (t.totalCost>0) t.roi=t.orderValue/t.totalCost;
  t.label = label;
  return t;
}

function aggregateQuarterAnchor(months, label, anchor) {
  let rows = SUMMARY_DATA.filter(r => r.anchor === anchor && months.some(m => r.month.includes(m)));
  let t = { leads:0, validLeads:0, totalReceipts:0, storeVisits:0, orders:0, orderValue:0, totalCost:0 };
  rows.forEach(r => {
    t.leads+=r.leads||0; t.validLeads+=r.validLeads||0; t.totalReceipts+=r.totalReceipts||0;
    t.storeVisits+=r.storeVisits||0; t.orders+=r.orders||0; t.orderValue+=r.orderValue||0; t.totalCost+=r.totalCost||0;
  });
  if (t.leads>0) { t.validRate=t.validLeads/t.leads; t.leadToStore=t.storeVisits/t.leads; t.leadOrderRate=t.orders/t.leads; t.leadCost=t.totalCost/t.leads; }
  if (t.validLeads>0) { t.validToStore=t.storeVisits/t.validLeads; t.validOrderRate=t.orders/t.validLeads; t.validCost=t.totalCost/t.validLeads; }
  if (t.totalCost>0) t.roi=t.orderValue/t.totalCost;
  return t;
}

function deltaStr(a, b) {
  if (!b || b === 0) return '<span class="neutral">新增</span>';
  let d = ((a - b) / b * 100);
  let arrow = d >= 0 ? '\u2191' : '\u2193';
  let cls = d >= 0 ? 'up' : 'down';
  return `<span class="${cls}">${arrow} ${Math.abs(d).toFixed(0)}%</span>`;
}

    filename = '主播直播时长.csv';
  } else {
    let headers = SUMMARY_COLS.map(c=>c.label).join(',');
    csv = headers + '\n';
    SUMMARY_DATA.forEach(r => {
      csv += SUMMARY_COLS.map(c => {
        let v = r[c.key];
        if (c.fmt==='pct') return (v*100).toFixed(1)+'%';
        if (c.fmt==='pct2') return v.toFixed(2);
        return v;
      }).join(',') + '\n';
    });
    filename = '主播月度数据.csv';
  }
  let blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
  let url = URL.createObjectURL(blob);
  let a = document.createElement('a');
  a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
  toast(`已导出 ${filename}`);
}

// ===== UTILS =====
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg, isError) {
  let t = document.createElement('div');
  t.className = 'toast'+(isError?' error':'');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}
</script>
</body>
</html>
